<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xamora docking component</title><link rel="stylesheet" href="../styles/docking.css"><style>
:root{--panel:#fff;--canvas:#e8e8ed;--input:#f5f5f8;--border:#c8c8d2;--text:#303038;--muted:#666675;--accent-soft:#e3eeff}*{box-sizing:border-box}body{margin:0;height:100vh;display:flex;flex-direction:column;font:14px 'Segoe UI',sans-serif;background:var(--canvas)}header.demo{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#20232c;color:white}header.demo strong{flex:1}header.demo button{padding:6px 12px;border:1px solid #777;background:#383c47;color:white}#dock{flex:1;min-height:0}article{padding:18px;overflow:auto}article h2{font-size:18px}article p{line-height:1.6}textarea{width:100%;height:220px;padding:12px;border:1px solid #ccc;resize:none;font:13px/1.6 Consolas,monospace}button{cursor:pointer}label{display:block;margin:12px 0}input{padding:7px;margin-left:10px;max-width:100%}
</style></head><body><header class="demo"><strong>Xamora · Standalone docking component</strong><button id="reset">Reset layout</button><button id="reopen">Reopen all windows</button><button id="save">Save layout</button><a href="../" style="color:#a3d0ff">Open designer</a></header><div id="dock"></div><script type="module">
import {DockLayout,createDockLayout} from '../core/docking.js';
import {DockWorkspace} from '../controls/dock-workspace.js';
const panels=[{id:'document:demo',title:'Welcome.xaml',kind:'document'},{id:'xaml',title:'XAML source',kind:'document'},{id:'layers',title:'Layers',kind:'tool'},{id:'toolkit',title:'Toolbox',kind:'tool'},{id:'properties',title:'Properties',kind:'tool'}];
const initial=()=>createDockLayout(panels.map(p=>p.id),{documents:['document:demo']});const model=new DockLayout(panels,initial());try{const saved=localStorage.getItem('xamora-standalone-dock');if(saved)model.load(saved);}catch{}
const workspace=new DockWorkspace(document.getElementById('dock'),model);const markup={'document:demo':'<h2>A workspace you can rearrange</h2><p>Drag a tab or title bar. Dock at any edge or on another tab group, or hold Ctrl/Command while dragging to float. Right-click a tab for all window actions.</p><p>The source editor and fields are live DOM elements: their contents survive docking.</p><button id="counter">Clicked 0 times</button>',xaml:'<h2>Live source editor</h2><textarea spellcheck="false" aria-label="Example XAML source">&lt;Grid&gt;\n    &lt;Button Content="Hello world" /&gt;\n&lt;/Grid&gt;</textarea>',layers:'<h2>Layers</h2><p>◇ Welcome.xaml</p><p>　▦ Grid</p><p>　　▣ Button</p>',toolkit:'<h2>Toolbox</h2><p>Grid · StackPanel · Canvas</p><p>Button · TextBlock · Border</p>',properties:'<h2>Properties</h2><label>Name<input value="MyButton"></label><label>Width<input type="number" value="160"></label><label>Height<input type="number" value="40"></label>'};
for(const p of panels){const content=document.createElement('article');content.innerHTML=markup[p.id];workspace.mount(p.id,content);}workspace.render();let count=0;document.getElementById('counter').onclick=e=>e.target.textContent='Clicked '+(++count)+' times';document.getElementById('reset').onclick=()=>model.load(initial());document.getElementById('reopen').onclick=()=>panels.forEach(p=>workspace.show(p.id));document.getElementById('save').onclick=()=>localStorage.setItem('xamora-standalone-dock',model.serialize());window.dockingDemo={model,workspace};
</script></body></html>
