<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Responsive compiler qualification</title>
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <main id="surface">
    <section id="layout" class="layout">
      <article id="card_one" class="card"><span>Intrinsic <strong>first</strong> card</span></article>
      <article id="card_two" class="card"><span>Second card with wrapping text in a responsive grid.</span></article>
      <article id="card_three" class="card"><span>Third card</span></article>
    </section>
    <section id="container" class="container"><div id="container_child">Container query</div></section>
    <div class="form"><input id="entry" value="Initial"><input id="check" type="checkbox" checked><select id="choice"><option>A</option><option selected>B</option></select><button id="action">Action</button></div>
    <div id="conditional">Environment</div>
  </main>
</body>
</html>
