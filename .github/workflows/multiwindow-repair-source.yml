name: Multiwindow repair source
on:
  push:
    branches: [feat/docking-browser-windows]
    paths: [.github/workflows/multiwindow-repair-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > "$RUNNER_TEMP/multiwindow-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: multiwindow-repair-source
          path: ${{ runner.temp }}/multiwindow-source.tar
          retention-days: 1
