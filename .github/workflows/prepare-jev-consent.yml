name: Prepare verified Jev consent fix
on:
  push:
    branches: [fix/jev-consent-run]
    paths: [.github/workflows/prepare-jev-consent.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Create reviewed source tree without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = c7eabf9e64e8193af0a31502b054131deeff2a21
          node --input-type=module <<'NODE'
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const patch = brotliDecompressSync(Buffer.from('', 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== '910a34611088dd42ee7f556576e4a6180fc2a6b78d37e9182cefd92d8b74c713') throw Error('Patch checksum mismatch');
          execFileSync('git', ['apply', '--index', '-'], {input:patch, stdio:['pipe','inherit','inherit']});
          NODE
          git rm .github/workflows/prepare-jev-consent.yml
          test "$(git write-tree)" = c7fb6e4396dc60a1714a40d946a994e22faafa69
          python3 - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          rows = []
          for p in filter(None, paths):
            row = dict(path=p, mode='100644', type='blob')
            if Path(p).exists(): row['content'] = Path(p).read_text()
            else: row['sha'] = None
            rows.append(row)
          data = dict(base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),tree=rows)
          Path(os.environ['RUNNER_TEMP'],'tree-input.json').write_text(json.dumps(data))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/tree.json")" = c7fb6e4396dc60a1714a40d946a994e22faafa69
          jq -r .sha "$RUNNER_TEMP/tree.json"
