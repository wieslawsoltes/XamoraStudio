name: Outline source recovery
on:
  push:
    branches: [feat/structural-outline-navigation]
    paths: [.github/workflows/outline-source-recovery.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create "$RUNNER_TEMP/outline-source.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: outline-source-recovery
          path: ${{ runner.temp }}/outline-source.bundle
          retention-days: 1
