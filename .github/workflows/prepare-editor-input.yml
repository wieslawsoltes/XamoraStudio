name: Prepare virtual editor input fix
on:
  push:
    branches: [fix/virtual-editor-text-input]
    paths: [.github/workflows/prepare-editor-input.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/virtual-editor-text-input
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/62e500e690368892c655975dcaa9bfeac55586fa" --jq .content | base64 --decode | gzip -dc > "$RUNNER_TEMP/editor-input.patch"
          echo "4f7467df3d3e5cfd0ee5dd7b6d9cfec3c093f22d1bd222e0ba74d21b50a3ae0b  $RUNNER_TEMP/editor-input.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/editor-input.patch"
          git apply "$RUNNER_TEMP/editor-input.patch"
          rm .github/workflows/prepare-editor-input.yml
      - run: npm ci
      - name: Validate exact source tree
        run: |
          npm run format:check
          npm run check
          npm test
          npm run build
          npm run release:check
          git add --all
          test "$(git write-tree)" = e296a3cce456e68ee04b20bd486b68daec165e4a
      - name: Commit validated source on the task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/virtual-editor-text-input
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: prevent large virtualized textarea insertions from stalling'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/virtual-editor-text-input
