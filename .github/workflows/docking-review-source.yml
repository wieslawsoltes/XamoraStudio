name: Apply docking review fixes
on:
  push:
    branches: [feat/docking-browser-windows]
    paths: [.github/workflows/docking-review-source.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checksum-verified locally tested changes
        run: |
          node --input-type=module <<'NODE'
          import { gunzipSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const patch = gunzipSync(Buffer.from('', 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== '0e9cd5b67c1944de1415a634f291b2f56e98a68fce425919a8fac36a64ad4eb7') throw Error('Patch checksum mismatch');
          execFileSync('git', ['apply', '--index', '-'], { input: patch, stdio: ['pipe', 'inherit', 'inherit'] });
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'fix: synchronize popup themes and export multiwindow package APIs'
          git push origin HEAD:feat/docking-browser-windows
