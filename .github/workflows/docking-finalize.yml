name: Finalize docking regression fix
on:
  push:
    branches: [feat/docking-browser-windows]
    paths: [.github/workflows/docking-finalize.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/docking-browser-windows
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply checksum-verified tested patch
        run: |
          node --input-type=module <<'NODE'
          import { inflateSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const patch = inflateSync(Buffer.from(''.replace('1VXJJJJsejsp', '1VXJJsejsp'), 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== 'dde01ae5a71c897c75bf593ae69356067b1a016fe56141a5c1ef49bc3f066f9a') throw Error('Patch checksum mismatch');
          execFileSync('git', ['apply', '--index', '-'], { input: patch, stdio: ['pipe', 'inherit', 'inherit'] });
          NODE
          git config user.name 'wieslawsoltes'
          git config user.email '2297442+wieslawsoltes@users.noreply.github.com'
          git commit -m 'fix: retain popup frames during unrelated panel registration'
          git push origin HEAD:feat/docking-browser-windows
