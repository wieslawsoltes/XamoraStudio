name: Apply property grid ownership fix
on:
  push:
    branches: [refactor/reusable-property-grid]
    paths: [.github/workflows/library-review.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply reviewed ownership fix
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/reusable-property-grid
          git apply --check .property-grid-fix.patch
          git apply .property-grid-fix.patch
          rm .property-grid-fix.patch
      - run: npm ci
      - run: npm run check && npm test
      - name: Commit validated source fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/studio/studio.js .property-grid-fix.patch
          git commit -m 'fix: preserve property grid when other docked inspectors render'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/refactor/reusable-property-grid
