name: Reusable controls review snapshot
on:
  push:
    branches: [refactor/reusable-property-grid]
    paths: [.github/workflows/library-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/xamora-controls-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: xamora-controls-source
          path: ${{ runner.temp }}/xamora-controls-source.tar.gz
          retention-days: 1
