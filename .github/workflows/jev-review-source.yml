name: Jev integration baseline
on:
  push:
    branches: [feat/jev-designer-assistant]
    paths: [.github/workflows/jev-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          git bundle create "$RUNNER_TEMP/jev-source.bundle" HEAD
          tar -czf "$RUNNER_TEMP/jev-tools.tgz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: jev-review-source
          path: |
            ${{ runner.temp }}/jev-source.bundle
            ${{ runner.temp }}/jev-tools.tgz
          retention-days: 1
