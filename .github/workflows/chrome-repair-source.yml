name: Capture document panel repair source
on:
  push:
    branches: [fix/document-panels-and-chrome]
    paths: [.github/workflows/chrome-repair-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > "$RUNNER_TEMP/studio-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-repair-source
          path: ${{ runner.temp }}/studio-source.tar
          retention-days: 1
