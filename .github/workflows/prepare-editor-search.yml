name: Prepare editor search tree
on:
  push:
    branches: [feat/editor-find-replace]
    paths: [.github/workflows/prepare-editor-search.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply tested patch and create tree without changing branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d99fee51235e2255a7dae911e94e0bf416fdde8e
          node --input-type=module <<'NODE'
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const parts = [0, 1].map(i => readFileSync(`.github/editor-search-data${i}.txt`, 'utf8').trim());
          const patch = brotliDecompressSync(Buffer.from(parts.join(''), 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== '0109ffdff7e16ee989abf15555d6aa810ff1b5c34213ebe12a743d9986765d16') throw Error('Editor patch checksum mismatch');
          execFileSync('git', ['apply', '--index', '-'], { input: patch, stdio: ['pipe', 'inherit', 'inherit'] });
          NODE
          git rm .github/editor-search-data0.txt .github/editor-search-data1.txt .github/workflows/prepare-editor-search.yml
          test "$(git write-tree)" = 235c6a8c2a8ceddc1e539678c2117e79e67c0f9e
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          rows = []
          for p in filter(None, paths):
            row = dict(path=p, mode='100644', type='blob')
            if Path(p).exists(): row['content'] = Path(p).read_text()
            else: row['sha'] = None
            rows.append(row)
          data = dict(base_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), tree=rows)
          Path(os.environ['RUNNER_TEMP'], 'tree-input.json').write_text(json.dumps(data))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/tree.json")" = 235c6a8c2a8ceddc1e539678c2117e79e67c0f9e
          jq -r .sha "$RUNNER_TEMP/tree.json"
