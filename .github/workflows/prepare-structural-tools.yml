name: Prepare structural tooling tree
on:
  push:
    branches: [feat/structural-language-tools]
    paths: [.github/workflows/prepare-structural-tools.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply reviewed patch and create tree without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 44c8dba89390992921fdb74a1fd09711fa5c2455
          node --input-type=module <<'NODE'
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const patch = brotliDecompressSync(Buffer.from('', 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== 'bb4f5cce190739e99f3a3963da6d74b7a3a04e9c92e23deeb49e62914c582c9a') throw Error('Patch checksum mismatch');
          execFileSync('git', ['apply', '--index', '-'], {input: patch, stdio: ['pipe', 'inherit', 'inherit']});
          NODE
          git rm .github/workflows/prepare-structural-tools.yml
          test "$(git write-tree)" = a69e262eac0681b94a21fbd924a17f9ce69112ba
          python3 - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          rows = []
          for p in filter(None, paths):
            row = dict(path=p, mode='100644', type='blob')
            if Path(p).exists(): row['content'] = Path(p).read_text()
            else: row['sha'] = None
            rows.append(row)
          data = dict(base_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), tree=rows)
          Path(os.environ['RUNNER_TEMP'], 'tree-input.json').write_text(json.dumps(data))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/tree.json")" = a69e262eac0681b94a21fbd924a17f9ce69112ba
          jq -r .sha "$RUNNER_TEMP/tree.json"
