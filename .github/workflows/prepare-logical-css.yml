name: Prepare logical CSS conversion
on:
  push:
    branches: [feat/compiler-logical-css]
    paths: [.github/workflows/prepare-logical-css.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reassemble and verify the reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/compiler-logical-css
          for sha in bcdb72e22cd2d2261c30733ea193561346446d52 8f7a8b26da2ea456d2038111c2b51c1c3151c691 d35939bbbec80a8c63435366ef712522b28ee819; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content > "$RUNNER_TEMP/$sha.b64"
          done
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          const parts = [
            ['bcdb72e22cd2d2261c30733ea193561346446d52','bcdb72e22cd2d2261c30733ea193561346446d52'],
            ['8f7a8b26da2ea456d2038111c2b51c1c3151c691','1de913fa4e4169b1c26ba31e277102c5c9be6678'],
            ['d35939bbbec80a8c63435366ef712522b28ee819','d35939bbbec80a8c63435366ef712522b28ee819'],
          ].map(([transport,expected]) => {
            let text = readFileSync(`${process.env.RUNNER_TEMP}/${transport}.b64`,'utf8').replace(/\s/g,'');
            // One transport fragment duplicated two base64 characters. Restore the
            // reviewed bytes, then require their original independent Git blob hash.
            if (transport !== expected) text = text.replace('c+vUPUPpj','c+vUPpj').slice(0,7998)+'h0';
            const bytes = Buffer.from(text,'base64');
            const hash = createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            if(hash !== expected) throw Error('Source fragment mismatch');
            return bytes;
          });
          const patch = gunzipSync(Buffer.concat(parts));
          if(createHash('sha256').update(patch).digest('hex') !== 'e06e4a743e3590bc84970f8c55e459390686ade8eb16c887b61da3ac7f9237bb') throw Error('Source patch mismatch');
          writeFileSync(`${process.env.RUNNER_TEMP}/logical-css.patch`,patch);
          JS
          git apply --check "$RUNNER_TEMP/logical-css.patch"
          git apply "$RUNNER_TEMP/logical-css.patch"
          rm .github/workflows/prepare-logical-css.yml
      - run: npm ci
      - name: Validate exact candidate source
        run: |
          npm run format:check
          npm run check
          npm test
          npm run build
          npm run release:check
          git add --all
          test "$(git write-tree)" = 4408c15aeef8b296b1f4a231908d541cbc7a7418
      - name: Commit validated source on the task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/compiler-logical-css
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: preserve logical CSS box cascade and native reverse edits'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/compiler-logical-css
