name: Verify document panel repair tree
on:
  push:
    branches: [fix/document-panels-and-chrome]
    paths: [.github/workflows/chrome-repair-tree.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare hash-verified source tree only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b5273a2f5e52a62b24b2ae879dba2f0120d9926e
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          source = Path('.github/workflows/chrome-repair-apply.yml').read_text()
          patch = source.split('          diff --git a/dist/core/render.js', 1)[1].split('\n          PATCH\n', 1)[0]
          patch = 'diff --git a/dist/core/render.js' + patch.replace('\n          ', '\n') + '\n'
          assert hashlib.sha256(patch.encode()).hexdigest() == '8d7f9b41fc59c461350e0daf03b7098006d0614cf6721ba5c6d6ff8321b188e4'
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, text=True, check=True)
          subprocess.run(['git', 'rm', '.github/workflows/chrome-repair-source.yml', '.github/workflows/chrome-repair-apply.yml', '.github/workflows/chrome-repair-tree.yml'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == 'ff3c8cf6f760151812e4cb876e91deaef5145706'
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          entries = []
          for path in paths:
              item = dict(path=path, mode='100644', type='blob')
              if Path(path).exists(): item['content'] = Path(path).read_text()
              else: item['sha'] = None
              entries.append(item)
          payload = dict(base_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), tree=entries)
          Path(os.environ['RUNNER_TEMP'], 'chrome-tree-input.json').write_text(json.dumps(payload))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/chrome-tree-input.json" > "$RUNNER_TEMP/chrome-tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/chrome-tree.json")" = ff3c8cf6f760151812e4cb876e91deaef5145706
      - uses: actions/upload-artifact@v4
        with:
          name: verified-chrome-repair-tree
          path: ${{ runner.temp }}/chrome-tree.json
          retention-days: 1
