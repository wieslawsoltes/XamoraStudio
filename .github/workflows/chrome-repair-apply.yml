name: Prepare verified chrome repair tree
on:
  push:
    branches: [fix/document-panels-and-chrome]
    paths: [.github/workflows/chrome-repair-apply.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Apply reviewed patch and prepare exact Git tree without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 4e715547ff3dead5c3aed41ce1be17268c6d9b61
          cat > "$RUNNER_TEMP/chrome.patch" <<'PATCH'
