          PATCH
          git apply --index "$RUNNER_TEMP/chrome.patch"
          git rm .github/workflows/chrome-repair-apply.yml
          test "$(git write-tree)" = ff3c8cf6f760151812e4cb876e91deaef5145706
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().rstrip('\0').split('\0')
          entries = []
          for path in paths:
              item = dict(path=path, mode='100644', type='blob')
              if Path(path).exists(): item['content'] = Path(path).read_text()
              else: item['sha'] = None
              entries.append(item)
          payload = dict(base_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), tree=entries)
          Path(os.environ['RUNNER_TEMP'], 'chrome-tree-input.json').write_text(json.dumps(payload))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/chrome-tree-input.json" > "$RUNNER_TEMP/chrome-tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/chrome-tree.json")" = ff3c8cf6f760151812e4cb876e91deaef5145706
      - uses: actions/upload-artifact@v4
        with:
          name: verified-chrome-repair-tree
          path: ${{ runner.temp }}/chrome-tree.json
          retention-days: 1
