name: Prepare compiler capture fidelity
on:
  push:
    branches: [fix/compiler-capture-fidelity]
    paths: [.github/workflows/review-capture.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed source patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compiler-capture-fidelity
          : > "$RUNNER_TEMP/capture.patch.xz"
          for sha in 920037ba0af24df3d2623acf456b86756ea0e8c8 d49e84285ef40a25be13d292634ddf96d40557f7; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode >> "$RUNNER_TEMP/capture.patch.xz"
          done
          echo "8a76e58ae2514153ee70eae7a9d7f7542be6e621c6831422b642c865e9975668  $RUNNER_TEMP/capture.patch.xz" | sha256sum --check
          xz -dc "$RUNNER_TEMP/capture.patch.xz" > "$RUNNER_TEMP/capture.patch"
          echo "86e864da646b40385f05987aca02cf72777a742f8df5fef0658565adaabd9bdb  $RUNNER_TEMP/capture.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/capture.patch"
          git apply "$RUNNER_TEMP/capture.patch"
          rm .github/workflows/review-capture.yml
      - run: npm ci
      - name: Validate exact source
        run: |
          npm run format:check
          npm run check
          npm test
          npm run build
          npm run release:check
          git add --all
          test "$(git write-tree)" = d5ccb27b3bb55f592cb36c0c6e51487950c085c9
      - name: Commit source to the isolated task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compiler-capture-fidelity
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: preserve capture privacy, native form state and physical layout'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/compiler-capture-fidelity
