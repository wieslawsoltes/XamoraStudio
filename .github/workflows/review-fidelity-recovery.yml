name: Integrate verified fidelity recovery
on:
  push:
    branches: [feat/compiler-fidelity-recovery]
    paths: [.github/workflows/review-fidelity-recovery.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed changes without reverting native-qualified main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/compiler-fidelity-recovery
          : > "$RUNNER_TEMP/integration.patch.gz"
          for sha in 0f988cc3315fa61303bc83275a4d2af3a1974649 eebdf3ffb66a2e80a142c1678a1697f8a5d04da0 e7bb8f0c72de52756ff2c459eafe7b9604ab861a 8ffa837ed3830f6cd95b88c80d7607b20324880b 01ce092fe44ae7171e66b19a974125b4a8568dec a234d3925549fd96289e4a1129223c2a7f4b8f67 c2c2f26871697f5ff69927f4c92c581e1490a6a0 00b1344e987c59430fba996472d0581b07e4fe54 94498d867b867448bd7dd437959a550068fd68e4 e477d31538867a4c0b9dc0973752c5683ce876f3; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode >> "$RUNNER_TEMP/integration.patch.gz"
          done
          gzip -dc "$RUNNER_TEMP/integration.patch.gz" > "$RUNNER_TEMP/integration.patch"
          echo "b015d7c95d90d53a79c9aa56fcc7cb3b1e9e6033c7efc5d751758615fdd17642  $RUNNER_TEMP/integration.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/integration.patch"
          git apply "$RUNNER_TEMP/integration.patch"
          rm .github/workflows/review-fidelity-recovery.yml
      - run: npm ci
      - name: Validate source and exact tested tree
        run: |
          npm run format:check
          npm run check
          npm test
          npm run build
          npm run release:check
          git add --all
          test "$(git write-tree)" = f268fb53755d56c432727f1f5d4aa50f5d9c7f64
      - name: Commit validated source only on the isolated task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/compiler-fidelity-recovery
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'feat: recover password-safe capture, responsive profiles and fidelity lab'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/compiler-fidelity-recovery
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
