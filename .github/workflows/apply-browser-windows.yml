name: Apply browser-window changes
on:
  push:
    branches: [feat/docking-browser-windows]
    paths: [tools/apply-browser-windows.mjs]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/docking-browser-windows
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact locally validated changes
        run: |
          node tools/apply-browser-windows.mjs
          rm tools/apply-browser-windows.mjs .github/workflows/apply-browser-windows.yml
          git config user.name 'wieslawsoltes'
          git config user.email '2297442+wieslawsoltes@users.noreply.github.com'
          git add -A
          test "$(git write-tree)" = '98cffa5545ce22faafc66e432167440bd97bc4b6'
          git commit -m 'feat: host live docking panels across browser windows'
          git push origin HEAD:feat/docking-browser-windows
