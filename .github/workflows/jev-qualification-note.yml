name: Prepare Jev qualification note
on:
  push:
    branches: [fix/jev-browser-connection]
    paths: [.github/workflows/jev-qualification-note.yml]
permissions:
  contents: read
jobs:
  tree:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Create exact reviewed documentation tree without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 61050bd54fbdff17970bd46bba4ad5a748a74fbe
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          p = Path('docs/JEV-INTEGRATION.md')
          text = p.read_text()
          changes = [
            ('serves the Studio under a Pages-shaped HTTPS origin', 'serves the Studio from a real loopback HTTPS fixture (with the Pages path layout and a test-only temporary certificate)'),
            ("The local-network permission grant represents the user's permission, not disabled browser security.", 'There is no Playwright request interception in this connection suite, including static files: interception was found to alter preflight behavior. The test-only certificate exception does not disable CORS. A local-network permission grant represents user permission, but this loopback fixture is not a claim of qualification for every public-network/browser policy. The exact deployed Pages origin is separately covered by HTTP allowlist tests and the credential-free TypeSafe preflight probe described above.')
          ]
          for before, after in changes:
            assert text.count(before) == 1
            text = text.replace(before, after)
          payload = dict(base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(), tree=[dict(path=str(p),mode='100644',type='blob',content=text),dict(path='.github/workflows/jev-qualification-note.yml',mode='100644',type='blob',sha=None)])
          Path(os.environ['RUNNER_TEMP'],'tree-input.json').write_text(json.dumps(payload))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/tree.json")" = 25c90a2a8fb89b4a1eea20f3f30c95ac26057aea
          jq -r .sha "$RUNNER_TEMP/tree.json"
