name: Search final review source
on:
  push:
    branches: [feat/editor-find-replace]
    paths: [.github/workflows/search-final-review-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create "$RUNNER_TEMP/search-final-source.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: search-final-review-source
          path: ${{ runner.temp }}/search-final-source.bundle
          retention-days: 1
