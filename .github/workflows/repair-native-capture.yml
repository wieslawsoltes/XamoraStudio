name: Prepare native capture repair
on:
  push:
    branches: [fix/compiler-capture-fidelity]
    paths: [.github/workflows/repair-native-capture.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed native-state repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/compiler-capture-fidelity
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/fa725e8c9973b633443cbd905c619d49c70bc608" --jq .content | base64 --decode | xz -dc > "$RUNNER_TEMP/native.patch"
          echo "36128d29df35c8ea519ffd82011fb7c0f349c452380c0e32b39373749b771805  $RUNNER_TEMP/native.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/native.patch"
          git apply "$RUNNER_TEMP/native.patch"
          rm .github/workflows/repair-native-capture.yml
      - run: npm ci
      - name: Validate exact source
        run: |
          npm run format:check
          npm run check
          npm test
          npm run build
          git add --all
          test "$(git write-tree)" = fe04c9ca167cc526f02fb0e670f3bf19a0863d2e
      - name: Commit validated source only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: separate HTML submission values from native toggle state'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/compiler-capture-fidelity
