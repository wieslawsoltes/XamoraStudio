name: Prepare search touch fix
on:
  push:
    branches: [feat/editor-find-replace]
    paths: [.github/workflows/prepare-search-touch.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Create reviewed tree without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 71e699defc887e286ff31fae617b30392d3f36cf
          node --input-type=module <<'NODE'
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const patch = brotliDecompressSync(Buffer.from('', 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== '77eb66e2691c1aa868af1034fd8e949f2fee28c39bdb7534b1053045bf305640') throw Error('Touch patch checksum mismatch');
          execFileSync('git',['apply','--index','-'],{input:patch,stdio:['pipe','inherit','inherit']});
          NODE
          git rm .github/workflows/prepare-search-touch.yml
          test "$(git write-tree)" = f2803a393dcfc738fd84a0223755f325dd812784
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          rows = []
          for p in filter(None, paths):
            row = dict(path=p, mode='100644', type='blob')
            if Path(p).exists(): row['content'] = Path(p).read_text()
            else: row['sha'] = None
            rows.append(row)
          data = dict(base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(), tree=rows)
          Path(os.environ['RUNNER_TEMP'],'tree-input.json').write_text(json.dumps(data))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/tree.json")" = f2803a393dcfc738fd84a0223755f325dd812784
          jq -r .sha "$RUNNER_TEMP/tree.json"
