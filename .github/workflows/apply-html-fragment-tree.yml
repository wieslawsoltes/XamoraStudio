name: Prepare contextual HTML tree
on:
  push:
    branches: [feat/html-contextual-fragments]
    paths: [.github/workflows/apply-html-fragment-tree.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Create exact reviewed source tree without updating branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b91357534ab17d67df566b90d8c315e007f26dda
          node --input-type=module <<'NODE'
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const patch = brotliDecompressSync(Buffer.from('', 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== 'cac6d7ab5598dd62707615782a1ff991a53cfc31409058976954f3a58e683f33') throw Error('HTML patch checksum mismatch');
          execFileSync('git', ['apply', '--index', '-'], { input: patch, stdio: ['pipe', 'inherit', 'inherit'] });
          NODE
          git rm .github/workflows/apply-html-fragment-tree.yml
          test "$(git write-tree)" = 36aa1a2677fdcf95c9ee649f581fd767eaa46c9d
          python3 - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          rows = []
          for p in filter(None, paths):
            row = dict(path=p, mode='100644', type='blob')
            if Path(p).exists(): row['content'] = Path(p).read_text()
            else: row['sha'] = None
            rows.append(row)
          data = dict(base_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), tree=rows)
          Path(os.environ['RUNNER_TEMP'], 'tree-input.json').write_text(json.dumps(data))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/tree.json")" = 36aa1a2677fdcf95c9ee649f581fd767eaa46c9d
          cat "$RUNNER_TEMP/tree.json"
