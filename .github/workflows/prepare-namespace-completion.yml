name: Prepare namespace completion tree
on:
  push:
    branches: [feat/namespace-completion]
    paths: [.github/workflows/prepare-namespace-completion.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Create reviewed tree without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 1fbb2ec2e0d711d064c2d7d312a88bb7487725ad
          node --input-type=module <<'NODE'
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const patch = brotliDecompressSync(Buffer.from([
          '',
          '',
          ''
          ].join(''), 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== '5c17a472418d0bc548e7e1c938a5dfff16ee7b585f905fbd89faf34896a95c59') throw Error('Patch checksum mismatch');
          execFileSync('git', ['apply', '--index', '-'], {input:patch, stdio:['pipe','inherit','inherit']});
          NODE
          git rm .github/workflows/prepare-namespace-completion.yml
          test "$(git write-tree)" = 2377d2be2b69b6ee27efe19f99185fb9f5143dde
          python3 - <<'PY'
          import json, subprocess, os
          from pathlib import Path
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          rows = []
          for p in filter(None, paths):
            row = dict(path=p, mode='100644', type='blob')
            if Path(p).exists(): row['content'] = Path(p).read_text()
            else: row['sha'] = None
            rows.append(row)
          data = dict(base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),tree=rows)
          Path(os.environ['RUNNER_TEMP'],'tree-input.json').write_text(json.dumps(data))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/tree.json")" = 2377d2be2b69b6ee27efe19f99185fb9f5143dde
          jq -r .sha "$RUNNER_TEMP/tree.json"
