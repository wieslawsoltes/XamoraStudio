name: Qualify native compiler output
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    name: Generate native fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: native-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Generate source and measured browser fixtures once
        shell: bash
        run: |
          set -euo pipefail
          node tests/native/generate-fixtures.mjs --browser
          for framework in WPF Avalonia; do
            printf '%s\n' "$GITHUB_SHA" > "test-results/native/$framework/source.sha"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-compiler-fixtures
          path: test-results/native/
          if-no-files-found: error
          retention-days: 7
  native:
    name: Native ${{ matrix.framework }}
    needs: fixtures
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: WPF
            project: Wpf
            os: windows-latest
          - framework: Avalonia
            project: Avalonia
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: native-compiler-fixtures
          path: test-results/native/
      - name: Verify fixtures came from this source revision
        shell: bash
        run: test "$(cat 'test-results/native/${{ matrix.framework }}/source.sha')" = "$GITHUB_SHA"
      - name: Load and assert actual native controls
        run: dotnet run --project tests/native/${{ matrix.project }}/${{ matrix.project }}.csproj --configuration Release -- test-results/native/${{ matrix.framework }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-compiler-${{ matrix.framework }}
          path: test-results/native/${{ matrix.framework }}/
          if-no-files-found: error
          retention-days: 7
