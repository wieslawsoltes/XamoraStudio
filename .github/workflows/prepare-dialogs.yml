name: Validate dialog availability follow-up
on:
  push:
    branches: [refactor/reusable-dialogs]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed follow-up
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/reusable-dialogs
          git apply --check .dialog-followup.patch
          git apply .dialog-followup.patch
          rm .dialog-followup.patch .github/workflows/prepare-dialogs.yml
      - run: npm ci
      - name: Verify source
        run: |
          npm run format:check
          npm run check
          npm test
          npm run build
          npm run release:check
          git add --all
          test "$(git write-tree)" = 3804703e4218f14cec2c4183290b7354ab683dfe
      - name: Commit verified source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: retain compiler action availability across async modal work'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/refactor/reusable-dialogs
