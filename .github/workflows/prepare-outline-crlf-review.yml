name: Prepare outline CRLF review fix
on:
  push:
    branches: [feat/structural-outline-navigation]
    paths: [.github/workflows/prepare-outline-crlf-review.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Create verified repair tree without changing refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 302c8ec9ada26ac6dae9e4df4797c30c529d4db7
          cat > "$RUNNER_TEMP/fix.patch" <<'PATCH'
          diff --git a/dist/studio/jev-workspace.js b/dist/studio/jev-workspace.js
          index b8111f3..46adf1c 100644
          --- a/dist/studio/jev-workspace.js
          +++ b/dist/studio/jev-workspace.js
          @@ -478,7 +478,7 @@ export class JevWorkspace {
                 s.doc.id === p.documentId &&
                 s.store.revision === p.revision &&
                 s.store.session.source === p.originalSource &&
          -      s.editor.input.value === p.originalSource &&
          +      s.editor.input.value === p.originalSource.replace(/\r\n?/g, '\n') &&
                 JSON.stringify(s.store.selection) === JSON.stringify(p.selection) &&
                 !s.sync.composing &&
                 (p.scope !== 'application' || p.appStamp === this.appStamp())
          diff --git a/tests/jev-workspace.test.mjs b/tests/jev-workspace.test.mjs
          index f4fbc9d..d4106a1 100644
          --- a/tests/jev-workspace.test.mjs
          +++ b/tests/jev-workspace.test.mjs
          @@ -549,3 +549,22 @@ test('forgetting keys aborts discovery and cannot report the old credentials con
             assert.equal(body.querySelector('[name=apiKey]').value, '');
             assert.doesNotMatch(body.querySelector('[data-jev-test-status]').textContent, /Connected/);
           });
          +
          +test('reviewed Jev proposals accept normalized CRLF editor text without weakening freshness guards', async (t) => {
          +  const { s, workspace, allow } = setup(t);
          +  const source = '\uFEFF<Grid>\r\n  <Button Content="Before"/>\r\n</Grid>\r\n';
          +  s.store.session.updateSource(source);
          +  s.store.select([s.doc.root.children.find((n) => n.kind === 'element').id]);
          +  s.editor.input.value = source.replace(/\r\n?/g, '\n');
          +  allow();
          +  await workspace.run();
          +  assert(workspace.fresh(), 'Canonical source and its normalized textarea are the same draft');
          +  s.editor.input.value += 'pending';
          +  assert.equal(workspace.fresh(), false, 'Uncaptured input still invalidates the proposal');
          +  s.editor.input.value = source.replace(/\r\n?/g, '\n');
          +  assert(workspace.fresh());
          +  workspace.apply();
          +  assert.equal(s.doc.root.children.find((n) => n.kind === 'element').props.Content, 'After');
          +  s.store.undo();
          +  assert.equal(s.store.session.source, source, 'Undo restores exact imported source');
          +});
          PATCH
          git apply --index "$RUNNER_TEMP/fix.patch"
          git rm .github/workflows/prepare-outline-crlf-review.yml
          test "$(git write-tree)" = ac22e31cb6d4f9d0cb3a70d5699d1507e7a58d9e
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '-z']).decode().split('\0')
          rows = []
          for p in filter(None, paths):
            row = dict(path=p, mode='100644', type='blob')
            if Path(p).exists(): row['content'] = Path(p).read_text()
            else: row['sha'] = None
            rows.append(row)
          data = dict(base_tree=subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), tree=rows)
          Path(os.environ['RUNNER_TEMP'], 'tree-input.json').write_text(json.dumps(data))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/tree.json")" = ac22e31cb6d4f9d0cb3a70d5699d1507e7a58d9e
          jq -r .sha "$RUNNER_TEMP/tree.json"
