name: Recover saved fidelity commits
on:
  push:
    branches: [recovery/compiler-responsive-native-saved]
    paths: [.github/workflows/recover-saved-fidelity.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Restore the original saved commit series on an archival branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/recovery/compiler-responsive-native-saved
          : > "$RUNNER_TEMP/saved.mbox.xz"
          for sha in c51b1ab15c7b32e75b2f73ec50abe714ba484f2a 576d37370ba093350de793d422468ff02fda4e57 9373bca508b6a642a41a0c9ec1f69b2c96c0239a 43a9be72a5bade74817ed766c3b80ed3e9a11b02; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode >> "$RUNNER_TEMP/saved.mbox.xz"
          done
          echo "744101f2eefba04345a14878dc031cc4d41abbd4c65379baccf0176b44516708  $RUNNER_TEMP/saved.mbox.xz" | sha256sum --check
          xz -dc "$RUNNER_TEMP/saved.mbox.xz" > "$RUNNER_TEMP/saved.mbox"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --exclude=.github/workflows/ci.yml "$RUNNER_TEMP/saved.mbox"
          rm .github/workflows/recover-saved-fidelity.yml
          git add --all
          echo "Recovered source tree: $(git write-tree)" >> "$GITHUB_STEP_SUMMARY"
          git restore --source=HEAD --staged --worktree .github/workflows/recover-saved-fidelity.yml
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/recovery/compiler-responsive-native-saved
          git log -3 --oneline >> "$GITHUB_STEP_SUMMARY"
          echo 'Historical saved implementation only. Do not merge over the newer native-qualified main; compatible additions are integrated separately.' >> "$GITHUB_STEP_SUMMARY"
