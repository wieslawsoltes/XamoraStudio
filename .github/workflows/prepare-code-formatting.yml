name: Prepare isolated formatting change
on:
  push:
    branches: [chore/code-formatting]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install pinned formatter and add validation commands
        run: |
          npm install --save-dev --save-exact --ignore-scripts prettier@3.9.0
          node --input-type=module <<'JS'
          import {readFile, writeFile, unlink, appendFile} from 'node:fs/promises';
          const file = 'package.json';
          const manifest = JSON.parse(await readFile(file, 'utf8'));
          manifest.scripts.format = 'prettier . --write';
          manifest.scripts['format:check'] = 'prettier . --check';
          await writeFile(file, JSON.stringify(manifest, null, 2) + '\n');
          await appendFile('.prettierignore', '\n# Local build, release and hosting workspaces.\n.artifacts/\n.package-build/\n.sites-runtime/\ndeliverables/\nupload/\n');
          await unlink('.github/workflows/prepare-code-formatting.yml');
          JS
      - name: Normalize source and verify formatter stability
        run: |
          npm run format > "$RUNNER_TEMP/format-write.log"
          npm run format > "$RUNNER_TEMP/format-normalize.log"
          npx prettier . --debug-check > "$RUNNER_TEMP/format-debug.log"
          npm run format:check
          npm run check
          npm test
      - name: Commit source formatting only to the task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/chore/code-formatting
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD --staged --worktree .github/workflows
          git add --all
          git commit -m 'style: format canonical source and enforce consistent conventions'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/chore/code-formatting
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
