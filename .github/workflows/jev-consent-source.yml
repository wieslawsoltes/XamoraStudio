name: Jev consent review source
on:
  push:
    branches: [fix/jev-consent-run]
    paths: [.github/workflows/jev-consent-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create "$RUNNER_TEMP/jev-consent-source.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: jev-consent-source
          path: ${{ runner.temp }}/jev-consent-source.bundle
          retention-days: 1
