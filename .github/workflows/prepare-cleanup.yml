name: Prepare focused source refactor
on:
  push:
    branches: [refactor/studio-composition]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply and validate the focused migration
        run: |
          node .cleanup-task.mjs
          rm .cleanup-task.mjs .github/workflows/prepare-cleanup.yml
          npm run format
          npm run format:check
          npm run check
          npm test
      - name: Commit source changes on the isolated task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/studio-composition
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore --source=HEAD --staged --worktree .github/workflows
          git add --all
          git commit -m 'refactor: separate Studio host startup and shared UI helpers'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/refactor/studio-composition
          git show --stat --oneline HEAD >> "$GITHUB_STEP_SUMMARY"
