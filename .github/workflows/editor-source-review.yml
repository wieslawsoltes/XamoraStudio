name: Editor review source
on:
  push:
    branches: [feat/editor-find-replace]
    paths: [.github/workflows/editor-source-review.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git bundle create "$RUNNER_TEMP/editor-source.bundle" HEAD refs/remotes/origin/main
      - uses: actions/upload-artifact@v4
        with:
          name: editor-review-source
          path: ${{ runner.temp }}/editor-source.bundle
          retention-days: 1
