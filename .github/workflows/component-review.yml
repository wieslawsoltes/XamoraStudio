name: Prepare remaining workspace components
on:
  push:
    branches: [refactor/workspace-components]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply checksum-verified source extraction
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/workspace-components
          python .component-change.py
      - run: npm ci
      - name: Validate extracted components
        run: |
          npm run format:check
          npm run check
          npm test
          npm run build
          npm run release:check
          git add --all
          test "$(git write-tree)" = 8156f61da705d1335e63e12e29689b5f6bc0d84c
      - name: Commit verified source on isolated task branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/workspace-components
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'refactor: extract remaining document-aware workspaces with scoped host lifecycle'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/refactor/workspace-components
