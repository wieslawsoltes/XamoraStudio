name: Component extraction review snapshot
on:
  push:
    branches: [refactor/workspace-components]
    paths: [.github/workflows/component-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=tar.gz --output="$RUNNER_TEMP/xamora-component-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: xamora-component-source
          path: ${{ runner.temp }}/xamora-component-source.tar.gz
          retention-days: 1
