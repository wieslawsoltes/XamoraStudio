name: Recover saved compiler work
on:
  push:
    branches: [recovery/compiler-fidelity-20260916]
    paths: [.github/workflows/recover-fidelity.yml]
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore verified saved commits on the recovery branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/recovery/compiler-fidelity-20260916
          : > "$RUNNER_TEMP/recovery.mbox.xz"
          for sha in 7fe59d0edcfd46cc5d6419bd3946b47ad0b1451e b5e0456de419924a5d3ea5ad692ccf3922618a47 21a78068a078d2c792fe5317ac28d10717c30f5c 3347ab3f74f78769ae560c5fa83db055a8bb5034 17292028a06a191beb57c54e16dace4637d41e10 3f7e1321e449b6ca351f5868a60b9f8569cdba38 1ee9773bcd16ce64900f18dd6923f585c7fbfc11; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode >> "$RUNNER_TEMP/recovery.mbox.xz"
          done
          echo "744101f2eefba04345a14878dc031cc4d41abbd4c65379baccf0176b44516708  $RUNNER_TEMP/recovery.mbox.xz" | sha256sum --check
          xz -dc "$RUNNER_TEMP/recovery.mbox.xz" > "$RUNNER_TEMP/recovery.mbox"
          echo "73c40eedbb4096262aeb42a125b90634da9e915978b9e674a651d0f02bf0ac8c  $RUNNER_TEMP/recovery.mbox" | sha256sum --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git am --exclude='.github/workflows/*' "$RUNNER_TEMP/recovery.mbox"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/recovery/compiler-fidelity-20260916
          git log -3 --oneline >> "$GITHUB_STEP_SUMMARY"
      - run: npm ci
      - run: npm run format:check -- --ignore-path .prettierignore
      - run: npm run check
      - run: npm test
