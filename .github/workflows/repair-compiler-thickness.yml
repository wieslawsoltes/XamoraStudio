name: Validate compact compiler thickness repair
on:
  push:
    branches: [feat/compiler-fidelity]
    paths: [.github/workflows/repair-compiler-thickness.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact reviewed compiler repair
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/feat/compiler-fidelity
          test "$(git hash-object dist/core/semantic-compiler.js)" = 3b110ef31e46f9cdc810e85bdb4da0875af0ea9f
          node --input-type=module <<'JS'
          import { readFile, writeFile, unlink } from 'node:fs/promises';
          const path = 'dist/core/semantic-compiler.js';
          const source = await readFile(path, 'utf8');
          const before = "  return values.length === 1 ? top : [left, top, right, bottom].join(',');";
          const after = [
            '  // Cascading expands shorthands to four sides. Preserve the established compact',
            '  // XAML spelling for uniform boxes after unit conversion and longhand overrides.',
            '  return [right, bottom, left].every((value) => value === top)',
            '    ? top',
            "    : [left, top, right, bottom].join(',');",
          ].join('\n');
          if (source.split(before).length !== 2) throw Error('Compiler repair anchor changed');
          await writeFile(path, source.replace(before, after));
          await unlink('.github/workflows/repair-compiler-thickness.yml');
          JS
      - run: npm ci
      - name: Validate exact source tree
        run: |
          npm run format:check
          npm run check
          npm test
          git add --all
          test "$(git write-tree)" = e4c5f9698ae5fbe3c8e7ad0d89250ec62c012fee
      - name: Commit validated source repair only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: preserve compact XAML thickness after CSS cascade expansion'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/compiler-fidelity
