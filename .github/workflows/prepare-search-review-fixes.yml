name: Prepare search review fixes
on:
  push:
    branches: [feat/editor-find-replace]
    paths: [.github/workflows/prepare-search-review-fixes.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Create verified tree without changing branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 0d234ffdebfad3dbf2176b254c8245c682c9e79b
          node --input-type=module <<'NODE'
          import { brotliDecompressSync } from 'node:zlib';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const patch = brotliDecompressSync(Buffer.from('', 'base64'));
          if (createHash('sha256').update(patch).digest('hex') !== 'f16f46019d44008b6758bc4882cd060d43496e52b87f2d246816ca1ff5f4a1ce') throw Error('Search review patch checksum mismatch');
          execFileSync('git', ['apply', '--index', '-'], {input:patch, stdio:['pipe','inherit','inherit']});
          NODE
          git rm .github/workflows/prepare-search-review-fixes.yml
          test "$(git write-tree)" = 8901925c637696ba59deb7532db7104b932ce225
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          rows = []
          for p in filter(None, paths):
            row = dict(path=p, mode='100644', type='blob')
            if Path(p).exists(): row['content'] = Path(p).read_text()
            else: row['sha'] = None
            rows.append(row)
          data = dict(base_tree=subprocess.check_output(['git','rev-parse','HEAD^{tree}'], text=True).strip(), tree=rows)
          Path(os.environ['RUNNER_TEMP'],'tree-input.json').write_text(json.dumps(data))
          PY
          gh api "repos/$GITHUB_REPOSITORY/git/trees" --method POST --input "$RUNNER_TEMP/tree-input.json" > "$RUNNER_TEMP/tree.json"
          test "$(jq -r .sha "$RUNNER_TEMP/tree.json")" = 8901925c637696ba59deb7532db7104b932ce225
          jq -r .sha "$RUNNER_TEMP/tree.json"
