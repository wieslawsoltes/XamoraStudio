name: Correct workspace type-consumer DOM reference
on:
  push:
    branches: [refactor/workspace-components]
    paths: [.github/workflows/fix-workspace-types.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Correct the verified ambiguous reference
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/refactor/workspace-components
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/package-test.mjs')
          text = path.read_text()
          old = 'new CanvasController(workspaceHost, {root: document.body})'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'new CanvasController(workspaceHost, {root: globalThis.document.body})'))
          PY
      - name: Commit only the type-consumer correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/package-test.mjs
          git commit -m 'test: distinguish browser document from design model in package consumer'
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/refactor/workspace-components
