name: Prepare compiler fidelity source
on:
  push:
    branches: [feat/compiler-fidelity]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/compiler-fidelity
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified source patch and commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object dist/core/semantic-compiler.js)" = 7b25a07f481fbec37241beb2b509e74cc5c13e69
          test "$(git hash-object docs/SEMANTIC-COMPILER.md)" = 170aaa03d9584f28d0de7efc989dc5827a9df3be
          : > "$RUNNER_TEMP/converter.patch.gz"
          for sha in 8564602ce7ec530bcbb200c0f0254b7259c60f01 3e1bddd85bc053d7cb998ea35a108f6baf542eeb 2cdf25de7b27bb7a8710cdf032066b724669bc1d 068b350402808d1bc5b2381e7285f4549fceef76 ca1cc7c9f8a25c178c50f51b6ed87edb06a7d8d3; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq .content | base64 --decode >> "$RUNNER_TEMP/converter.patch.gz"
          done
          gzip -dc "$RUNNER_TEMP/converter.patch.gz" > "$RUNNER_TEMP/converter.patch"
          echo "3d9601536913443915e39be66d9d49f5d444687d7728c237a80cdb8378828287  $RUNNER_TEMP/converter.patch" | sha256sum --check
          git apply --check "$RUNNER_TEMP/converter.patch"
          git apply "$RUNNER_TEMP/converter.patch"
          git add dist/core/semantic-compiler.js docs/SEMANTIC-COMPILER.md tests/semantic-fidelity.test.mjs tests/browser-compiler-fidelity.mjs
          git config user.name 'Wiesław Šoltés'
          git config user.email 'wieslawsoltes@users.noreply.github.com'
          git commit -m 'feat: improve HTML/XAML cascade, rich text and form fidelity'
          git push origin HEAD:feat/compiler-fidelity
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Archive current source
        if: always()
        run: git archive --format=tar.gz HEAD > "$RUNNER_TEMP/compiler-fidelity-source.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compiler-fidelity-source
          path: ${{ runner.temp }}/compiler-fidelity-source.tar.gz
          retention-days: 7
