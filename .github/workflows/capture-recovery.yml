name: Snapshot capture review workspace
on:
  push:
    branches: [chore/capture-recovery-20260917]
    paths: [.github/workflows/capture-recovery.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9882666fe6b9a0aa1c7b6bc3dd595791210eacc7
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Archive exact merged source and locked build tools
        run: |
          test "$(git rev-parse HEAD)" = 9882666fe6b9a0aa1c7b6bc3dd595791210eacc7
          git bundle create "$RUNNER_TEMP/merged-compiler.bundle" HEAD
          tar -czf "$RUNNER_TEMP/merged-compiler.tar.gz" --exclude='./.git' --exclude='./test-results' .
      - uses: actions/upload-artifact@v4
        with:
          name: merged-compiler-review
          path: |
            ${{ runner.temp }}/merged-compiler.tar.gz
            ${{ runner.temp }}/merged-compiler.bundle
          retention-days: 1
